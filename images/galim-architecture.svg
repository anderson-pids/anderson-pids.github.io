<svg xmlns="http://www.w3.org/2000/svg" width="640" height="925" viewBox="0 0 640 925" role="img" aria-labelledby="title desc">
<title id="title">Galim: local gameplay architecture</title><desc id="desc">A static host delivers assets over HTTPS. Inside the browser, React calls the TypeScript game engine; bots receive a limited observation and send their move through the engine. React renders the updated state. No gameplay API is used.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#21756c"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#183c43}.title{font-size:28px;font-weight:700}.label{font-size:22px;font-weight:700}.detail{font-size:20px}.note{font-size:18px;fill:#46646a}.arrow{fill:none;stroke:#21756c;stroke-width:3;marker-end:url(#arrow)}</style>
<rect width="640" height="925" rx="18" fill="#f4f7f6"/>
<text x="28" y="43" class="title">Galim / local game</text><text x="28" y="74" class="note">Delivery over HTTPS. Gameplay in browser memory.</text><rect x="28" y="100" width="584" height="88" rx="12" fill="#ffffff" stroke="#adc6c2"/><text x="48" y="133" class="label">Static web host</text><text x="48" y="164" class="detail">HTML, CSS, JavaScript and media</text><path d="M320 188 L320 229" class="arrow"/><text x="338" y="216" class="note">HTTPS download</text><rect x="28" y="237" width="584" height="622" rx="14" fill="#e6f0ed" stroke="#21756c" stroke-dasharray="7 5"/><text x="48" y="274" class="label">PLAYER’S BROWSER</text><rect x="48" y="297" width="544" height="94" rx="12" fill="#ffffff" stroke="#adc6c2"/><text x="68" y="330" class="label">React interface</text><text x="68" y="361" class="detail">Tile selection, board, score and turn feedback</text><path d="M320 391 L320 439" class="arrow"/><text x="340" y="420" class="note">Function calls</text><rect x="48" y="446" width="544" height="118" rx="12" fill="#ffffff" stroke="#adc6c2"/><text x="68" y="479" class="label">TypeScript game engine</text><text x="68" y="510" class="detail">Match → Hand → Board + scoring</text><text x="68" y="537" class="detail">Validates actions; updates state and score</text><path d="M320 564 L320 611" class="arrow"/><text x="340" y="593" class="note">Limited observation</text><rect x="48" y="618" width="544" height="116" rx="12" fill="#ffffff" stroke="#adc6c2"/><text x="68" y="651" class="label">Bot strategy</text><text x="68" y="682" class="detail">Own tiles + public board + legal moves</text><text x="68" y="709" class="detail">Chosen action returns to engine validation</text><text x="48" y="775" class="detail">Engine state → React renders the next turn</text><text x="48" y="810" class="note">No gameplay HTTP requests or database.</text><text x="48" y="837" class="note">Reloading does not restore the match.</text><text x="28" y="896" class="note">Online rooms and reconnection are future work.</text>
</svg>