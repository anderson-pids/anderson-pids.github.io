baseURL = "https://www.anderson-pids.com.br/"
locale = "en-us"
title = "Anderson Pimentel"
theme = "PaperMod"
enableRobotsTXT = true
copyright = "© Anderson Pimentel"

[pagination]
  pagerSize = 5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.highlight]
  noClasses = false

[params]
  env = "production"
  title = "Anderson Pimentel"
  description = "Anderson Pimentel writes about platform engineering, site reliability and running AI systems in production."
  keywords = ["anderson pimentel", "sre", "platform engineering", "kubernetes", "gitops", "observability", "llmops"]
  author = "Anderson Pimentel"
  defaultTheme = "auto"
  mainSections = ["post"]
  DateFormat = "January 2, 2006"
  ShowReadingTime = true
  ShowToc = true
  TocOpen = false
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowShareButtons = true
  ShareButtons = ["linkedin", "x"]

  [params.profileMode]
    enabled = true
    title = "Anderson Pimentel"
    imageUrl = "img/profile.jpg"
    imageWidth = 160
    imageHeight = 160
    imageTitle = "Anderson Pimentel"
    subtitle = "Senior SRE / Platform Engineer · Kubernetes, GitOps, observability and AI in production"

    [[params.profileMode.buttons]]
      name = "Posts"
      url = "/post/"

    [[params.profileMode.buttons]]
      name = "About"
      url = "/about/"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/andersonpimentel/"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/anderson-pids"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:apds.anderson@gmail.com"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

[[menu.main]]
  name = "Posts"
  url = "/post/"
  weight = 1

[[menu.main]]
  name = "Archive"
  url = "/archives/"
  weight = 2

[[menu.main]]
  name = "Search"
  url = "/search/"
  weight = 3

[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 4

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 5
