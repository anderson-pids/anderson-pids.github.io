<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1030" viewBox="0 0 640 1030" role="img" aria-labelledby="title desc">
<title id="title">Tribe Academy: client, server and data architecture</title><desc id="desc">Browser requests reach Next.js over HTTPS. Server-side components use Supabase Auth, PostgreSQL RLS and RPCs, and private Storage. The browser downloads PDFs using short-lived signed URLs after authorization. Auth events return to a Next.js email hook, which verifies signatures and reserves a database budget before sending through Resend.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#21756c"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#183c43}.title{font-size:28px;font-weight:700}.label{font-size:22px;font-weight:700}.detail{font-size:20px}.note{font-size:18px;fill:#46646a}.arrow{fill:none;stroke:#21756c;stroke-width:3;marker-end:url(#arrow)}</style>
<rect width="640" height="1030" rx="18" fill="#f4f7f6"/>
<text x="28" y="43" class="title">Tribe Academy / request flow</text><text x="28" y="74" class="note">Shared application. Access scoped by organization.</text><rect x="28" y="99" width="584" height="92" rx="12" fill="#ffffff" stroke="#adc6c2"/><text x="48" y="132" class="label">Browser</text><text x="48" y="163" class="detail">Pages, interactive components and forms</text><path d="M320 191 L320 241" class="arrow"/><text x="340" y="219" class="note">HTTPS + session</text><rect x="28" y="248" width="584" height="147" rx="12" fill="#ffffff" stroke="#adc6c2"/><text x="48" y="281" class="label">Next.js application · Coolify</text><text x="48" y="312" class="detail">Server Components, Actions and route handlers</text><text x="48" y="339" class="detail">Session + hostname + membership checks</text><text x="48" y="366" class="detail">Returns pages, action results and redirects</text><path d="M320 395 L320 446" class="arrow"/><text x="340" y="425" class="note">Server-side SDK calls</text><rect x="28" y="453" width="584" height="168" rx="12" fill="#ffffff" stroke="#adc6c2"/><text x="48" y="486" class="label">Supabase</text><text x="48" y="517" class="detail">Auth: identity and session validation</text><text x="48" y="544" class="detail">PostgreSQL: data API, RLS and RPC rules</text><text x="48" y="571" class="detail">Storage: private PDFs; server signs access</text><text x="48" y="598" class="detail">Browser follows a 5-minute signed PDF URL</text><path d="M320 621 L320 671" class="arrow"/><text x="340" y="651" class="note">Auth email event</text><rect x="28" y="678" width="584" height="118" rx="12" fill="#ffffff" stroke="#adc6c2"/><text x="48" y="711" class="label">Next.js email hook</text><text x="48" y="742" class="detail">Verify webhook signature</text><text x="48" y="769" class="detail">Reserve database budget before delivery</text><path d="M320 796 L320 842" class="arrow"/><text x="340" y="825" class="note">HTTPS + idempotency</text><rect x="28" y="849" width="584" height="87" rx="12" fill="#ffffff" stroke="#adc6c2"/><text x="48" y="882" class="label">Resend</text><text x="48" y="913" class="detail">Deliver the authentication email</text><text x="28" y="976" class="note">Ordinary data calls carry the user’s session.</text><text x="28" y="1003" class="note">Privileged file and email operations stay server-side.</text>
</svg>